# Docker Compose for Neuralwire (frontend + backend served from one Go process).
#
# Usage:
#   docker compose up -d --build
#
# Override with environment / compose.prod.yml for production settings:
#   APP_ENV, ADMIN_USERNAME, ADMIN_PASSWORD, ADMIN_TOKEN_SECRET,
#   AI_SUMMARY_API_KEY, AI_SUMMARY_PROVIDER, CORS_ALLOW_ORIGIN, PUBLIC_API_URL.

services:
  neuralwire:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        # Frontend build-time variable (sitemap/OG/canonical URLs).
        PUBLIC_SITE_URL: ${PUBLIC_SITE_URL:-}
    image: neuralwire:latest
    container_name: neuralwire
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      APP_ENV: ${APP_ENV:-production}
      PORT: "8080"
      DB_PATH: /app/data/neuralwire.db
      STATIC_DIR: /app/static
      # Required in production — never use defaults:
      ADMIN_USERNAME: ${ADMIN_USERNAME:?set ADMIN_USERNAME in .env}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?set ADMIN_PASSWORD in .env}
      ADMIN_TOKEN_SECRET: ${ADMIN_TOKEN_SECRET:?set ADMIN_TOKEN_SECRET in .env}
      # AI summary (optional; fallback heuristic summaries used without it):
      AI_SUMMARY_API_KEY: ${AI_SUMMARY_API_KEY:-}
      AI_SUMMARY_PROVIDER: ${AI_SUMMARY_PROVIDER:-}
      AI_SUMMARY_BASE_URL: ${AI_SUMMARY_BASE_URL:-}
      AI_SUMMARY_MODEL: ${AI_SUMMARY_MODEL:-}
      # Browser origins allowed for CORS (comma separated). In production this
      # should be your public site URL, not localhost.
      CORS_ALLOW_ORIGIN: ${CORS_ALLOW_ORIGIN:-https://example.com}
      # Where the browser reaches the backend API. Served at the same origin
      # in production, so leave unset unless the API is on a separate domain.
      PUBLIC_API_URL: ${PUBLIC_API_URL:-}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      LOG_FORMAT: ${LOG_FORMAT:-json}
      GLOBAL_RATE_LIMIT: ${GLOBAL_RATE_LIMIT:-120}
    volumes:
      - neuralwire-data:/app/data

volumes:
  neuralwire-data:
