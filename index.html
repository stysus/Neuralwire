<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Halo Dunia</title>
  <style>
    body {
      font-family: system-ui, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      background: #0f172a;
      color: #e2e8f0;
    }
    h1 { color: #38bdf8; }
    p { color: #94a3b8; }
    button {
      margin-top: 16px;
      padding: 10px 20px;
      border: none;
      border-radius: 8px;
      background: #38bdf8;
      color: #0f172a;
      font-size: 16px;
      cursor: pointer;
    }
    button:hover { background: #7dd3fc; }
  </style>
</head>
<body>
  <h1>Halo Dunia</h1>
  <p>Website HTML minimal yang dibuka di browser Orca.</p>
  <button id="tombol">Klik saya</button>
  <script>
    const judul = document.querySelector('h1');
    judul.textContent = 'Halo Dunia';

    const tombol = document.getElementById('tombol');
    tombol.addEventListener('click', () => {
      tampilkanPesan();
    });

    function tampilkanPesan() {
      alert('Halo dari Orca IDE!');
    }
  </script>
</body>
</html>
